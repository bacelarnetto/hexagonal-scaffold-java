# Template -- NAO aplique este arquivo com os valores abaixo. Copie para secret.yaml (ja esta no
# .gitignore, nunca vai parar no Git), preencha usuario/senha reais do banco, e so entao
# `kubectl apply -f kubernetes/secret.yaml`.
#
# Alternativa mais alinhada com producao no GCP: nao versionar nem gerenciar isso via arquivo
# nenhum -- usar Secret Manager do GCP + o CSI driver de Secret Store, ou criar o Secret
# diretamente via `kubectl create secret generic scaffold-db-secret --from-literal=db_user=... \
# --from-literal=db_password=...` a partir de um pipeline de CI com acesso ao Secret Manager.
apiVersion: v1
kind: Secret
metadata:
  name: scaffold-db-secret
type: Opaque
stringData:
  db_user: "CHANGE_ME"
  db_password: "CHANGE_ME"
