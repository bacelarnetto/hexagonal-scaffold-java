spring:
  application:
    name: hexagonal-scaffold-java

  datasource:
    url: "jdbc:h2:mem:scaffold;DB_CLOSE_DELAY=-1;MODE=MySQL"
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

# Grupos de probe do Kubernetes: /actuator/health/liveness e /actuator/health/readiness.
# Fora de um ambiente com Kubernetes (ex: rodando local) isso so acrescenta um endpoint a mais,
# nao muda nada do comportamento da aplicacao.
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
