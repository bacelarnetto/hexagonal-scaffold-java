spring.application.name=hexagonal-scaffold-java

spring.datasource.url=jdbc:h2:mem:scaffold;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Grupos de probe do Kubernetes: /actuator/health/liveness e /actuator/health/readiness.
# Fora de um ambiente com Kubernetes (ex: rodando local) isso so acrescenta um endpoint a mais,
# nao muda nada do comportamento da aplicacao.
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info
